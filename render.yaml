## Render Infrastructure-as-Code
## Deploy with: https://render.com/deploy
## Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: data-analyst-api
    runtime: python
    region: oregon
    plan: free           # upgrade to "starter" ($7/mo) for always-on
    buildCommand: pip install -r backend/requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.4"
      - key: GROQ_API_KEY
        sync: false            # set manually in Render dashboard → Secret
      - key: DATABASE_URL
        fromDatabase:
          name: data-analyst-db
          property: connectionString
      # REDIS_URL is optional. Without it, conversation history is kept in memory
      # (lost on restart/sleep). To persist it, add an Upstash Redis URL (rediss://...).
      - key: ALLOWED_ORIGINS
        sync: false            # set to your Vercel URL, e.g. https://your-app.vercel.app
      - key: LANGSMITH_TRACING
        value: "false"

databases:
  - name: data-analyst-db
    databaseName: sales_db
    user: analyst
    plan: free               # 1 GB storage, 97 hours/month on free tier

## ── Notes ────────────────────────────────────────────────────────────────────
## Redis (optional): history falls back to in-memory storage when REDIS_URL is unset.
##   To keep conversations across restarts, create a free Upstash Redis database and set
##   its rediss://... URL as REDIS_URL in the Render dashboard.
##
## Frontend: Deploy the frontend separately on Vercel.
##   Set API_URL = https://<your-render-service>.onrender.com on Vercel.
